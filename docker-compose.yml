version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rustserverpanel-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
    volumes:
      - ./data:/app/data
    networks:
      - rustpanel

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rustserverpanel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rustpanel

networks:
  rustpanel:
    driver: bridge

volumes:
  data:
